name: Update (refresh prices)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Catch up member prices
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python scripts/update.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Price update $(date -u +%F)"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi
      - name: Stamp build version into asset URLs
        run: |
          sed -i "s/__BUILD__/${GITHUB_SHA:0:8}/g" index.html
          printf '{"build":"%s"}' "${GITHUB_SHA:0:8}" > version.json
      - name: Publish site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: '.github,scripts'
